name: Historical Secret Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/history-secret-scan.yml'

permissions:
  contents: read

jobs:
  full_history:
    name: Full Git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "${expected}  /tmp/${archive}" | sha256sum --check --strict
          mkdir -p /tmp/gitleaks
          tar -xzf "/tmp/${archive}" -C /tmp/gitleaks gitleaks
          echo '/tmp/gitleaks' >> "$GITHUB_PATH"

      - name: Scan complete Git history
        run: gitleaks git --redact --exit-code 2 --no-banner --log-level info .
